[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lh-log-sentry"
version = "0.1.0"
description = "Parses Linux auth.log, syslog, Nginx/Apache access logs, and JSON audit streams to detect SSH brute-force campaigns, sudo privilege escalations, log tampering/truncation gaps, and suspicious command execution."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "logihertzsystems", email = "ops@logihertz.com" },
    { name = "Sameer Tawade (Creator, Founder, Director & Sole Developer)", email = "ops@logihertz.com" },
]
maintainers = [
    { name = "Logihertz Systems (OPC) Private Limited", email = "ops@logihertz.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "bandit>=1.7.0",
]


[project.urls]
Homepage = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-log-sentry"
Repository = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-log-sentry"
Documentation = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-log-sentry#documentation"
Issues = "https://github.com/Logihertz-Systems-OPC-Pvt-Ltd/lh-log-sentry/issues"

[project.scripts]
lh-sentry = "lh_log_sentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lh_log_sentry"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter / long regex strings)
    "B008", # do not perform function calls in argument defaults (standard Typer idiom)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --cov=lh_log_sentry --cov-report=term-missing"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = []
